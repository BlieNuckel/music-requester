name: CI and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  HUSKY: 0

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: tsc --noEmit

      - name: Typecheck server
        run: pnpm run typecheck:server

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Test frontend
        run: pnpm test

      - name: Test server
        run: pnpm run test:server

  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Fetched on its own so a dependency bump that leaves nix/package.nix's
      # pnpmDeps hash stale fails here, before the package build, and the
      # mismatch is the only plausible reason for this step to fail.
      - name: Fetch the pnpm dependencies
        id: deps
        shell: bash # the default `bash -e` has no pipefail, so `| tee` would mask a failed build
        run: nix build .#tunearr.pnpmDeps --print-build-logs 2>&1 | tee "$RUNNER_TEMP/pnpm-deps.log"

      - name: Report the correct pnpmDeps hash
        if: failure() && steps.deps.conclusion == 'failure'
        run: .github/scripts/report-stale-pnpm-hash.sh "$RUNNER_TEMP/pnpm-deps.log"

      # Builds the flake package so a break surfaces here rather than on a
      # user's nixos-rebuild.
      - name: Build the Nix package
        run: nix build .#tunearr --print-build-logs

  publish:
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
